{% load static %}

<!-- Navbar -->

<nav class="navbar navbar-dark bg-primary shadow py-0 border text-white">

    <div class="container-fluid px-1">

        <!-- Menu -->

        <button id="menuFleetCard"
            class="btn btn-primary h-100 rounded-0 d-flex flex-column justify-content-center align-items-center"
            type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarFleetCard"
            aria-controls="sidebarFleetCard">

           

            <i id="menuIconFleetCard" class="bi bi-list fs-2 text-white">
            </i>

        </button>

        <!-- Logo -->

        <a href="/" class="navbar-brand position-absolute top-50 start-50 translate-middle p-0 m-0">

            <img src="{% static 'imagens/Logo_FleetCard_para_cadastro_de_veículos-removebg-preview.png' %}"
                alt="FleetCard" class="img-fluid mt-4" style="max-height: 150px; width: auto;">

        </a>

        <!-- Home -->

        <a href="/" class="btn btn-white ms-auto text-white">

            <i class="bi bi-house-fill me-1 text-white"></i>

            Home

        </a>

    </div>

</nav>


<!-- Sidebar -->

<div class="offcanvas offcanvas-start bg-primary" tabindex="-1" id="sidebarFleetCard"
    aria-labelledby="sidebarFleetCardLabel">


    <!-- Cabeçalho -->

    <div class="offcanvas-header bg-transparent text-white justify-content-start py-2" style="min-height: 85px;">

        <button id="fecharSidebarFleetCard" type="button"
            class="btn btn-primary text-white fw-normal d-flex align-items-center gap-2" data-bs-dismiss="offcanvas"
            aria-label="Fechar">

            <span>
                FECHAR
            </span>

            <i class="bi bi-x-lg"></i>

        </button>

    </div>


    <!-- Conteúdo -->

    <div class="offcanvas-body p-0 bg-info">

        <div class="list-group list-group-flush bg-info">


            <!-- Home -->

            <a href="{% url 'home' %}" class="list-group-item list-group-item-action py-3">

                <i class="bi bi-house-fill text-primary me-3"></i>

                Home

            </a>


            <!-- Veículos -->

            <a href="{% url 'pagina_veiculos' %}" class="list-group-item list-group-item-action py-3">

                <i class="bi bi-car-front-fill text-primary me-3"></i>

                Veículos

            </a>


            <!-- Cadastrar -->

            <a href="#" class="list-group-item list-group-item-action py-3">

                <i class="bi bi-plus-circle-fill text-primary me-3"></i>

                Cadastrar veículo

            </a>

            <a href="{% url 'contatos' %}" class="list-group-item list-group-item-action py-3">

                <i class="bi bi-telephone-fill text-primary me-3"></i>

                Contatos

            </a>

            <a href="{% url 'sobre' %}" class="list-group-item list-group-item-action py-3">

                <i class="bi bi-info-circle-fill text-primary me-3"></i>
            

                Sobre o FleetCard

            </a>


        </div>


        <!-- Rodapé -->

        <div class="text-center bg-primary w-100 p-4">

            <a href="/" class="d-block text-decoration-none">

                <img src="{% static 'imagens/Logo_FleetCard_para_cadastro_de_veículos-removebg-preview.png' %}"
                    alt="FleetCard" class="img-fluid d-block mx-auto w-75 w-md-50">

            </a>

            <h5 class="text-info fw-bold mb-0">
                FleetCard
            </h5>

            <p class="text-info small mb-0">
                Sistema de cadastro e controle de veículos.
            </p>

        </div>

    </div>

</div>
